# AP + STA 共存（AIC8800 rwnx 驱动声明 STA/AP/P2P 组合，CONFIG_MCC=y）
# ENABLED=1 时开机就起 duck-XXXX 热点，STA 同时连已保存的 WiFi：
# 手机连热点打开 http://10.42.0.1 配网，不用先把设备从家里网络断开。
ENABLED=0

# 热点接口名（由 iw 在 wlan0 上创建）
AP_IFACE=ap0

# SSID：auto = duck-<machine-id 前 4 位>；也可以写死
SSID=auto

# 信道：和 STA 同信道最稳（跨信道要 MCC 分时）；不确定就用 6
CHANNEL=6

# 热点地址
ADDR=10.42.0.1

# 热点密码文件（首次启动自动生成 8 位）
PSK_FILE=/etc/microduck/ap.psk

# 是否在热点上跑配网页面（busybox httpd + CGI）
PORTAL=1
