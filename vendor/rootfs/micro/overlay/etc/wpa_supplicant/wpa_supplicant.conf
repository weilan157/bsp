# microduck WiFi 配置
#
# 默认**不带任何 network={}**：这样首次开机（或没配置过）时，
# microduck-wifi 会直接启动 AP 配网热点：
#     SSID: microduck-setup   密码: microduck123
#     手机/电脑连上后浏览器打开 http://192.168.4.1 填 SSID 和密码
# 保存后 save.cgi 会把 network 块写进本文件并自动切换到联网模式。
#
# 想跳过配网页、直接内置网络，就把下面 network={} 的注释去掉并改好。
#
# update_config=0 很关键：设成 1 时 wpa_supplicant 会把协商结果/hex PSK 回写，
# 之前就因为这样把密码写成十六进制串，导致怎么改都握不上手（WRONG_KEY）。
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=0
country=CN

# AIC8800 的 nl80211 对 sched_scan/offload 支持不完整，关掉更稳。
ap_scan=1
disable_scan_offload=1
p2p_disabled=1

