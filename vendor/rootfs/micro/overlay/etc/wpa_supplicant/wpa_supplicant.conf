# microduck 默认 WiFi 配置：rcS 里的 microduck-wifi 会在后台自动连。
#
# 需要换网络时只改 network={} 块。update_config=0 很关键：设成 1 时
# wpa_supplicant 会把协商结果/hex PSK 回写这个文件，之前就因为这样把密码写成
# 了十六进制串，导致怎么改都握手失败（WRONG_KEY）。
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=0
country=CN

# 这颗 AIC8800 的 nl80211 对 sched_scan/offload 支持不完整，关掉更稳。
ap_scan=1
disable_scan_offload=1
p2p_disabled=1

network={
	ssid="ZTE_B82B8E"
	psk="204204204"
	key_mgmt=WPA-PSK
	scan_ssid=1
}
