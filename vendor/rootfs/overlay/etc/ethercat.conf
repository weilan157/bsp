#------------------------------------------------------------------------------
#
#  EtherCAT master configuration (Orange Pi R2S)
#  板上由 ethercat-board-conf 在启动前按 PCI 10ec:8125 填充接口名。
#
#------------------------------------------------------------------------------

# 占位：由 /usr/local/sbin/ethercat-board-conf 覆盖写入 /run/ethercat.conf
MASTER0_DEVICE="ff:ff:ff:ff:ff:ff"
#MASTER0_BACKUP=""

DEVICE_MODULES="generic"

# 由 board-conf 按实际 enp*/r8125 口填充
UPDOWN_INTERFACES=""

#MODPROBE_FLAGS="-b"
