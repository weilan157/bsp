#------------------------------------------------------------------------------
#
#  EtherCAT master configuration (Orange Pi R2S)
#  运行时由 ethercat-board-conf 覆盖为 /run/ethercat.conf
#  默认设备模块：r8169（原生 ec_r8169 驱动 RTL8125）
#
#------------------------------------------------------------------------------

MASTER0_DEVICE="ff:ff:ff:ff:ff:ff"
#MASTER0_BACKUP=""

DEVICE_MODULES="r8169"

# 原生 r8169 路径下通常为空（generic 才需要 UPDOWN）
UPDOWN_INTERFACES=""

#MODPROBE_FLAGS="-b"
